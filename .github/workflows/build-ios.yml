name: Build SwitchRecomp iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Build Dependencies
        run: |
          brew install cmake ninja sdl3

      - name: Inject System Keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -n "$PROD_KEYS" ]; then
            mkdir -p ~/.config/switch/
            echo "$PROD_KEYS" > ~/.config/switch/prod.keys
          fi

      - name: Build Rust Workspace for iOS
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Package Unsigned IPA Artifact
        run: |
          mkdir -p Payload
          # 自动收集编译出的二进制文件并打包
          find target/aarch64-apple-ios/release -maxdepth 1 -type f -executable -exec cp {} Payload/ \;
          
          # 封装为 IPA 格式
          zip -r SwitchRecomp-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchRecomp-iOS-IPA
          path: SwitchRecomp-iOS.ipa
